<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doctor Who TARDIS Sightings Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    #map {
      width: 100%;
      height: 90%;
    }

    h1 {
      color: #003366;
      font-family: "Garamond", serif;
      font-size: 24px;
      text-align: center;
    }

    .legend {
      line-height: 18px;
      background-color: #eee;
      padding: 6px;
      font-size: 12px;
    }

    .legend i {
      width: 18px;
      height: 18px;
      float: left;
      margin-right: 8px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>Doctor Who TARDIS Sightings in London</h1>
  <div id="map"></div>

  <script>
    $(document).ready(function () {
      // Set up the base map
      var map = L.map('map').setView([51.5074, -0.1278], 13);

      var OSMTiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      var baseMaps = {
        "OpenStreetMap": OSMTiles
      };

      var layerControl = L.control.layers(baseMaps, null).addTo(map);

      // Load TARDIS GeoJSON data
      $.getJSON('./tardis_locations.geojson', function(data) {
        var tardisLayer = L.geoJSON(data, {
          pointToLayer: function(feature, latlng) {
            return L.marker(latlng, {
              icon: L.icon({
                iconUrl: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnfk_TTztHx5wIaczOhdRcC2CVkmyt_LjPbw&s', // Replace this URL with the image URL
                iconSize: [50, 50], // Adjust the size as necessary
                iconAnchor: [25, 50], // Anchor at the bottom center
                popupAnchor: [0, -50] // Position the popup above the image
              })
            });
          },
          onEachFeature: function(feature, layer) {
            layer.bindPopup(
              "<strong>TARDIS Landing Site</strong><br>" +
              "Doctor: " + feature.properties.doctor + "<br>" +
              "Year: " + feature.properties.year
            );
          }
        }).addTo(map);

        layerControl.addOverlay(tardisLayer, "TARDIS Sightings");
      });
    });
  </script>
</body>
</html>
