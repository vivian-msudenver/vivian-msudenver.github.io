<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doctor Who TARDIS Sightings Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #1a237e;
      color: yellow;
      font-family: 'Arial', sans-serif;
    }

    #map {
      width: 100%;
      height: 90%;
    }

    h1 {
      color: yellow;
      font-family: "Garamond", serif;
      font-size: 28px;
      text-align: center;
      margin-top: 20px;
    }

    .popup-heading {
      color: black;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .popup-text {
      color: black;
      font-size: 14px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>Doctor Who TARDIS Sightings in London</h1>
  <div id="map"></div>

  <script>
    $(document).ready(function () {
      var map = L.map('map').setView([51.5074, -0.1278], 13);

      var spaceTiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      var baseMaps = {
        "Space Theme": spaceTiles
      };

      var layerControl = L.control.layers(baseMaps, null).addTo(map);

      var tardisLocations = {
        "type": "FeatureCollection",
        "features": [
          {
            "type": "Feature",
            "properties": {
              "doctor": "The First Doctor",
              "year": "1963",
              "description": "The First Doctor's adventures began in 1963, marking the start of the Doctor's time-traveling adventures. This was the first appearance of the TARDIS and the Doctor as we know him today."
            },
            "geometry": {
              "type": "Point",
              "coordinates": [-0.1278, 51.5074]
            }
          },
          {
            "type": "Feature",
            "properties": {
              "doctor": "The Fourth Doctor",
              "year": "1977",
              "description": "The Fourth Doctor, known for his long scarf and wide-brimmed hat, arrived in London in 1977. He quickly became one of the most beloved incarnations, bringing a quirky and whimsical style to the show."
            },
            "geometry": {
              "type": "Point",
              "coordinates": [-0.1246, 51.5007]
            }
          },
          {
            "type": "Feature",
            "properties": {
              "doctor": "The Tenth Doctor",
              "year": "2006",
              "description": "In 2006, the Tenth Doctor, played by David Tennant, landed in London. Known for his wit and charm, the Tenth Doctor faced numerous challenges during his time in the TARDIS."
            },
            "geometry": {
              "type": "Point",
              "coordinates": [-0.1420, 51.5014]
            }
          },
          {
            "type": "Feature",
            "properties": {
              "doctor": "The Eleventh Doctor",
              "year": "2011",
              "description": "With his bow tie and fez, the Eleventh Doctor brought a sense of wonder and oddity to the series. In 2011, he faced a series of challenges while exploring the intricacies of time and space."
            },
            "geometry": {
              "type": "Point",
              "coordinates": [-0.1340, 51.5094]
            }
          },
          {
            "type": "Feature",
            "properties": {
              "doctor": "The Thirteenth Doctor",
              "year": "2018",
              "description": "Jodie Whittaker's Thirteenth Doctor brought a fresh and dynamic energy to the role. Her first appearance in 2018 was an exciting new chapter in the Doctor Who legacy."
            },
            "geometry": {
              "type": "Point",
              "coordinates": [-0.1195, 51.5033]
            }
          },
          {
            "type": "Feature",
            "properties": {
              "doctor": "The Fifteenth Doctor",
              "year": "2024",
              "description": "The Fifteenth Doctor, played by Ncuti Gatwa, brings new stories and adventures to the TARDIS. Fans are eager to see how this new incarnation will evolve the Doctor’s journey in the years to come."
            },
            "geometry": {
              "type": "Point",
              "coordinates": [-0.0761, 51.5081]
            }
          }
        ]
      };

      var tardisLayer = L.geoJSON(tardisLocations, {
        pointToLayer: function(feature, latlng) {
          return L.marker(latlng, {
            icon: L.icon({
              iconUrl: 'https://p7.hiclipart.com/preview/1008/277/229/eleventh-doctor-doctor-who-tardis-bluetooth-speaker-wireless-speaker-doctor-who-tardis-thumbnail.jpg',
              iconSize: [50, 50],
              iconAnchor: [25, 50],
              popupAnchor: [0, -50]
            })
          });
        },
        onEachFeature: function(feature, layer) {
          var popupContent = '<div class="popup-heading">Doctor: ' + feature.properties.doctor + '</div>' +
                             '<div class="popup-text">Year of Appearance: ' + feature.properties.year + '</div>' +
                             '<div class="popup-heading">Location:</div>' +
                             '<div class="popup-text">Coordinates: ' + feature.geometry.coordinates[1].toFixed(4) + ', ' + feature.geometry.coordinates[0].toFixed(4) + '</div>' +
                             '<div class="popup-heading">Description:</div>' +
                             '<div class="popup-text">' + feature.properties.description + '</div>';

          layer.bindPopup(popupContent);
        }
      }).addTo(map);

      layerControl.addOverlay(tardisLayer, "TARDIS Sightings");
    });
  </script>
</body>
</html>
